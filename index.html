    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        as="style">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- FONT AWESOME -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
        media="print" onload="this.media='all'">

    <!-- TAILWIND CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        * {
            font-family: 'Inter', sans-serif;
        }

        /* Custom Toggle Switch Style */
        .dot {
            transition: transform 0.3s ease;
        }
        #viewToggle:checked ~ .relative .block {
             background-color: #3b82f6;
        }
        #viewToggle:checked ~ .relative .dot {
            transform: translateX(1.5rem);
        }

        /* View styles */
        #resultsContainer.grid-view {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1.5rem;
        }

        #resultsContainer.list-view {
            display: flex;
            flex-direction: column;
            gap: 0.75rem; /* 12px */
        }

        #resultsContainer.list-view .movie-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem; /* 16px */
        }
    </style>
</head>

<body class="bg-gray-100 p-4 md:p-8">

    <div class="container mx-auto max-w-5xl">

        <h1 class="text-3xl md:text-4xl font-bold text-gray-800 text-center mb-8">Movie Search</h1>

        <!-- Search and View Toggle -->
        <div class="flex flex-col md:flex-row items-center justify-between mb-8 bg-white p-4 rounded-xl shadow-sm">
            <div class="relative flex-grow w-full">
                <input type="text" id="searchInput" placeholder="Search for movies or anime..."
                    class="w-full px-4 py-3 pl-12 rounded-lg border border-gray-300 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition-all outline-none text-base">
                <i class="fas fa-search absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400 text-lg"></i>
            </div>
            <div class="md:ml-6 mt-4 md:mt-0 flex items-center">
                <span class="text-gray-600 mr-3 font-medium">List View</span>
                <label for="viewToggle" class="flex items-center cursor-pointer">
                    <div class="relative">
                        <input type="checkbox" id="viewToggle" class="sr-only">
                        <div class="block bg-gray-300 w-14 h-8 rounded-full">
                            <div class="dot absolute left-1 top-1 bg-white w-6 h-6 rounded-full"></div>
                        </div>
                    </div>
                </label>
                 <span class="text-gray-600 ml-3 font-medium">Grid View</span>
            </div>
        </div>

        <!-- Results Container -->
        <div id="resultsContainer">
            <!-- Movie results will be injected here -->
        </div>

    </div>

    <!-- Modal -->
    <div id="movieModal" class="hidden fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-lg w-full p-6 relative">
            <button id="closeModal" class="absolute top-3 right-3 text-gray-400 hover:text-gray-600 transition-colors">
                <i class="fas fa-times text-2xl"></i>
            </button>
            <h2 id="modalTitle" class="text-xl font-bold text-gray-800 mb-6">Movie Title</h2>
            <a id="modalDownloadLink" href="#" target="_blank"
                class="w-full text-center bg-blue-600 text-white px-6 py-3 rounded-lg hover:bg-blue-700 transition-colors font-semibold text-lg">
                <i class="fas fa-download mr-2"></i>Download
            </a>
        </div>
    </div>

    <script>
        // Globals
let movieList = [];

// DOM Elements
let searchInput;
let resultsContainer;
let viewToggle;
let movieModal;
let modalTitle;
let modalDownloadLink;
let closeModal;

function renderResults(movies) {
    resultsContainer.innerHTML = '';

    if (movies.length === 0) {
        resultsContainer.innerHTML = '<p class="text-center text-gray-500 col-span-full">No movies found matching your search.</p>';
        return;
    }

    movies.forEach(movie => {
        const movieCard = document.createElement('div');
        movieCard.className = 'movie-card bg-white rounded-lg shadow-md p-4 cursor-pointer hover:shadow-lg transition-shadow';
        movieCard.dataset.url = movie.url;

        movieCard.innerHTML = `
            <h3 class="font-bold text-lg text-gray-800 truncate">${movie.title}</h3>
        `;

        movieCard.addEventListener('click', () => showModal(movie.title, movie.url));
        resultsContainer.appendChild(movieCard);
    });
}

function handleSearch() {
    const searchTerm = searchInput.value.toLowerCase();
    const filteredMovies = movieList.filter(movie =>
        movie.title.toLowerCase().includes(searchTerm)
    );
    renderResults(filteredMovies);
}

function toggleView() {
    if (viewToggle.checked) {
        resultsContainer.classList.add('grid-view');
        resultsContainer.classList.remove('list-view');
    } else {
        resultsContainer.classList.add('list-view');
        resultsContainer.classList.remove('grid-view');
    }
}

function showModal(title, downloadLink) {
    modalTitle.textContent = title;
    modalDownloadLink.href = downloadLink;
    movieModal.classList.remove('hidden');
}

function hideModal() {
    movieModal.classList.add('hidden');
}


document.addEventListener('DOMContentLoaded', () => {
    // Assign DOM elements
    searchInput = document.getElementById('searchInput');
    resultsContainer = document.getElementById('resultsContainer');
    viewToggle = document.getElementById('viewToggle');
    movieModal = document.getElementById('movieModal');
    modalTitle = document.getElementById('modalTitle');
    modalDownloadLink = document.getElementById('modalDownloadLink');
    closeModal = document.getElementById('closeModal');

    // Add event listeners
    searchInput.addEventListener('keyup', handleSearch);
    viewToggle.addEventListener('change', toggleView);
    closeModal.addEventListener('click', hideModal);
    movieModal.addEventListener('click', (e) => {
        if (e.target === movieModal) {
            hideModal();
        }
    });

    // Load movie data
    movieList = movieData;

    // Set initial view
    toggleView();

    // Initial render
    renderResults(movieList);
});
    </script>
